[project]
name = "kael"
version = "0.1.0"
description = "CMDB management system built with Django"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<5.2",
    "asgiref>=3.8.1",
    "pytz>=2024.1",
    "sqlparse>=0.5.0",
    "typing-extensions>=4.12.0",
    "channels>=4.1.0",
    "kubernetes>=31.0.0",
    "python-dotenv>=1.0.1",
    "django-redis>=6.0.0",
    "requests>=2.32.0",
    "djangorestframework>=3.15.2",
    "drf-spectacular>=0.27.2",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["Kael*", "order*", "users*", "project*", "webshell*", "utils*"]

[dependency-groups]
dev = []
