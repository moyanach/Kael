[project]
name = "kael"
version = "0.1.0"
description = "CMDB management system built with Django"
requires-python = ">=3.11"
dependencies = [
    "django==3.2",
    "asgiref==3.6.0",
    "pytz==2022.7.1",
    "sqlparse==0.4.3",
    "typing-extensions==4.8.0",
    "channels==4.0.0",
    "kubernetes==18.20.0",
    "pymysql==1.1.0",
    "python-dotenv==1.0.1",
    "django-redis==5.4.0",
    "requests>=2.28.0",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["Kael*", "order*", "users*", "project*", "webshell*", "utils*"]

[dependency-groups]
dev = []
